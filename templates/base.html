<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>
    <!-- Modern Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div id="ambient-background"></div>
    
    <nav class="navbar glass-effect">
        <div class="nav-container">
            <a href="{{ url_for('home') }}" class="logo">PORTFOLIO<span>.</span></a>
            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}" class="nav-item">Home</a></li>
                <li><a href="{{ url_for('about') }}" class="nav-item">About</a></li>
                <li><a href="{{ url_for('projects') }}" class="nav-item">Projects</a></li>
                <li><a href="{{ url_for('contact') }}" class="nav-item">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </div>
        </div>
    </nav>

    <main class="page-transition">
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Developer Portfolio. Designed with precision.</p>
        </div>
    </footer>

    <!-- Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
